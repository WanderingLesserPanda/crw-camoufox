name: build-camoufox

# Builds fastcrw/crw's crw-server WITH the camoufox renderer feature
# (absent from the vendor's published image, which builds
# --features cdp,impersonated only) and publishes it to this repo's
# own GHCR package: ghcr.io/<owner>/<repo>
#
# Quiet days: the check step sees the upstream release is unchanged and
# exits after ~10 seconds. On a new upstream release: ~20-40 min compile
# on GitHub's runner (their hardware, not the NAS), smoke test, push.
# A failed build pushes nothing, so consumers keep the last good image.

on:
  schedule:
    - cron: "30 3 * * *"        # daily, 03:30 UTC (11:30 SGT)
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the upstream release is unchanged"
        type: boolean
        default: false

permissions:
  contents: write     # commit LAST_BUILT.txt back to this repo
  packages: write     # GITHUB_TOKEN pushes to ghcr.io/<owner>/<repo>

env:
  # gh CLI inside a runner does NOT inherit GITHUB_TOKEN — the first `gh api`
  # call fails (exit 4) without this.
  GH_TOKEN: ${{ github.token }}
  # GHCR rejects mixed-case image names, and GitHub expressions have no pipe
  # filter (| lowercase is invalid syntax) — hardcode the fully-lowercase
  # name, same pattern as eventally's IMAGE_NAME.
  IMAGE: ghcr.io/wanderinglesserpanda/crw-camoufox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # This repo (for LAST_BUILT.txt)
      - uses: actions/checkout@v4

      # What should we build? The latest *release tag* of upstream, e.g. "0.44.0"
      - name: Resolve latest upstream release
        id: tag
        run: |
          TAG="$(gh api repos/fastcrw/crw/releases/latest --jq .tag_name)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream release: $TAG"

      # Quiet-day gate: skip the compile if we already built this exact tag
      - name: Already built?
        id: check
        if: "!inputs.force"
        run: |
          if [ -f LAST_BUILT.txt ] && [ "$(cat LAST_BUILT.txt)" = "${{ steps.tag.outputs.tag }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built ${{ steps.tag.outputs.tag }} — nothing to do."
          fi

      # Upstream source at that tag, into ./upstream
      - name: Fetch upstream source
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: fastcrw/crw
          ref: ${{ steps.tag.outputs.tag }}
          path: upstream

      # The ONLY difference from the vendor image: +camoufox in the feature set.
      # The vendor's own Dockerfile documents CARGO_PKGS as an overridable ARG
      # and its runtime stage is a directory copy that "tolerates the variable
      # set", so this override is the intended mechanism.
      # (Optional slimming, if builds ever get too slow: drop " -p crw-mcp
      #  -p crw-cli" — only crw-server is required for our use.)
      - name: Build image
        if: steps.check.outputs.skip != 'true'
        run: |
          docker build upstream/ \
            --build-arg CARGO_PKGS="-p crw-server --features cdp,impersonated,camoufox -p crw-mcp -p crw-cli" \
            -t "$IMAGE:${{ steps.tag.outputs.tag }}" \
            -t "$IMAGE:latest"

      # Fail the run (push nothing) if the server does not boot and answer
      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        run: |
          docker run -d --name crw-smoke -p 3000:3000 -e RUST_LOG=info "$IMAGE:latest"
          ok=0
          for i in $(seq 15); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1 \
               || curl -sf http://127.0.0.1:3000/v1/capabilities >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          docker logs crw-smoke | tail -20 || true
          [ "$ok" = "1" ] || { echo "SERVER FAILED TO BOOT"; exit 1; }
          curl -s http://127.0.0.1:3000/v1/capabilities | head -c 500 || true
          docker rm -f crw-smoke

      # docker/login-action is the proven pattern (raw `docker login -p
      # "$GITHUB_TOKEN"` failed on the runner with "password is empty").
      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        if: steps.check.outputs.skip != 'true'
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker push "$IMAGE:latest"

      # Remember what we built, so tomorrow's run can skip
      - name: Record built tag
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ steps.tag.outputs.tag }}" > LAST_BUILT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_BUILT.txt
          git commit -m "record build of ${{ steps.tag.outputs.tag }}"
          git push
